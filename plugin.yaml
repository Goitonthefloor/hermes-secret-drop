name: secret-drop
version: "1.1.0"
description: >
  Give Hermes a password or token without putting it in the chat or the model
  context. Desktop opens a masked field. The connected gateway writes the value
  to a private file, stores it as an environment variable, and deletes the file.
author: community
license: MIT
tags: [desktop, security, secrets]
provides_hooks:
  - on_session_start
