name: secret-drop
version: "1.7.1"
description: >
  Give Hermes a password or token without the value ever appearing in the chat.
  Desktop opens a masked field. The connected gateway writes the
  value to a private file, stores it as an environment variable, and deletes the
  file; or, when a Vaultwarden backend is configured, it stores the value as a
  login item in the vault instead. The model uses {{secret:NAME}} and the gateway
  substitutes the value at execution time.
author: community
license: MIT
tags: [desktop, security, secrets]
config_schema:
  backend:
    type: str
    choices: [file, vaultwarden]
    default: file
    label: Secret store
    description: >-
      "file" keeps secrets in the profile environment file (owner-only). "vaultwarden"
      stores a new secret as a login item in a Bitwarden-compatible vault and resolves
      {{secret:NAME}} from there; names the vault does not know still read from the file.
  vaultwarden_base_url:
    type: str
    label: Vaultwarden URL
    description: Base URL of the vault, for example https://vault.example.test. Required when the store is "vaultwarden".
  vaultwarden_email:
    secret: true
    env: vaultwarden_USER
    label: Vault login (user)
    description: Account name of the vault login. Stored in the profile environment file, never in this config.
  vaultwarden_password:
    secret: true
    env: vaultwarden
    label: Vault login (master password)
    description: Master password of the vault login. Stored in the profile environment file, never in this config.
provides_hooks:
  - on_session_start
  - pre_tool_call
  - transform_terminal_output
  - transform_tool_result
